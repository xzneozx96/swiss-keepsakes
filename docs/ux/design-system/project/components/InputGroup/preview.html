<!-- @dsCard group="Forms" height=170 -->
<div class="ds-stage">
  <style>
    .lb{font-family:var(--font-sans);font-size:var(--text-sm);line-height:var(--leading-sm);font-weight:var(--font-weight-medium);color:var(--color-foreground)}
    .ig{display:flex;align-items:stretch;height:40px;width:343px;border-radius:var(--radius-xl);background:var(--color-field);border:var(--border-width-field) solid var(--color-field-border);box-shadow:var(--shadow-surface);overflow:hidden;font-family:var(--font-sans)}
    .pre,.suf{display:flex;align-items:center;padding:0 12px;color:var(--color-field-placeholder)}
  </style>
  <div class="ds-item">
    <div style="display:flex;flex-direction:column;gap:4px"><span class="lb">Erfasster Betrag</span>
      <div class="ig">
        <span class="pre" style="font-size:var(--text-sm);font-weight:var(--font-weight-medium);border-right:var(--border-width-field) solid var(--color-field-border)">CHF</span>
        <span class="num" style="flex:1;display:flex;align-items:center;padding:0 12px;font-size:var(--text-base);color:var(--color-foreground)">37.80</span>
        <span class="suf" style="font-size:var(--text-xs);border-left:var(--border-width-field) solid var(--color-field-border)">von 89.00</span>
      </div>
      <span style="font-family:var(--font-sans);font-size:var(--text-xs);line-height:var(--leading-xs);color:var(--color-muted)">Noch offen: CHF 37.80</span>
    </div>
    <span class="ds-note">prefix / suffix px 12 · inner dividers in field-border (HeroUI draws them once the border is 1px)</span>
  </div>
</div>
