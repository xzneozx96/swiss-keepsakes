<!-- @dsCard group="Forms" height=170 -->
<div class="ds-stage">
  <style>
    .lb{font-family:var(--font-sans);font-size:var(--text-sm);line-height:var(--leading-sm);font-weight:var(--font-weight-medium);color:var(--color-foreground)}
    .s{width:38px;height:40px;border-radius:var(--radius-xl);background:var(--color-field);border:var(--border-width-field) solid var(--color-field-border);box-shadow:var(--shadow-surface);display:flex;align-items:center;justify-content:center;font-family:var(--font-sans);font-size:18px;font-weight:var(--font-weight-semibold);color:var(--color-foreground)}
  </style>
  <div class="ds-item">
    <div style="display:flex;flex-direction:column;gap:4px">
      <span class="lb">Code aus der E-Mail</span>
      <div style="display:flex;align-items:center;gap:8px">
        <span class="s" aria-label="Ziffer 1 von 6">4</span><span class="s">8</span><span class="s">1</span>
        <span style="width:6px;height:2px;border-radius:var(--radius-sm);background:var(--color-separator)"></span>
        <span class="s" style="border-color:var(--color-focus);box-shadow:0 0 0 1px var(--color-focus)"><span style="width:2px;height:16px;border-radius:2px;background:var(--color-field-placeholder)"></span></span>
        <span class="s"></span><span class="s"></span>
      </div>
      <span style="font-family:var(--font-sans);font-size:var(--text-xs);line-height:var(--leading-xs);color:var(--color-muted)">6 Ziffern, gültig 10 Minuten</span>
    </div>
    <span class="ds-note">3 filled · active slot ink ring · each slot aria-label "Ziffer n von 6" · ≈282px fits 343</span>
  </div>
</div>
