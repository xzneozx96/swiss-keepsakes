<!-- @dsCard group="Layout" height=340 subtitle="Section Header and empty state with one action" -->
<div class="ds-stage">
  <div class="ds-item" style="align-items:stretch;max-width:420px">
    <div style="display:flex;flex-direction:column;border-radius:var(--radius-3xl);background:var(--color-surface);padding:4px">
      <span style="padding:6px 8px 4px;font-size:var(--text-xs);line-height:var(--leading-xs);font-weight:500;color:var(--color-muted)">Heute</span>
      <div style="display:flex;flex-direction:column;align-items:center;gap:12px;padding:24px 16px">
        <div style="width:56px;height:56px;border-radius:var(--radius-2xl);background:var(--color-surface-secondary);display:flex;align-items:center;justify-content:center"><span class="ds-note" style="text-align:center">3D</span></div>
        <span style="text-align:center;font-size:var(--text-sm);line-height:var(--leading-sm);color:var(--color-muted)">Noch keine Bestellungen. Teilen Sie Ihren QR-Code, um zu starten.</span>
        <div style="display:flex;align-items:center;height:36px;padding:0 12px;border-radius:var(--radius-3xl);background:var(--color-default);font-size:var(--text-sm);font-weight:500;color:var(--color-accent-soft-foreground)">QR-Code anzeigen</div>
      </div>
    </div>
    <span class="ds-note">Header 12/16 · icon slot 56 for the 3D set · one secondary Button sm</span>
  </div>
</div>
