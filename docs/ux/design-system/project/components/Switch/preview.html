<!-- @dsCard group="Forms" height=336 -->
<div class="ds-stage">
  <style>
    .sw{display:flex;align-items:center;flex-shrink:0;padding:0 2px;background:var(--color-accent)}
    .th{background:var(--color-accent-foreground);box-shadow:var(--shadow-surface)}
    .off{background:var(--color-default);box-shadow:inset 0 0 0 1px var(--color-control-border)}
    .lbl{font-family:var(--font-sans);font-size:var(--text-sm);line-height:var(--leading-sm);font-weight:var(--font-weight-medium);color:var(--color-foreground)}
    .d{padding-left:52px;font-family:var(--font-sans);font-size:var(--text-xs);line-height:var(--leading-xs);color:var(--color-muted)}
  </style>
  <div class="ds-row" style="align-items:center">
    <div class="ds-item" style="align-items:center"><span class="sw" style="width:32px;height:16px;border-radius:8px;justify-content:flex-end"><span class="th" style="width:16.5px;height:12px;border-radius:6px"></span></span><span class="ds-note">sm</span></div>
    <div class="ds-item" style="align-items:center"><span class="sw" style="width:40px;height:20px;border-radius:12px;justify-content:flex-end"><span class="th" style="width:22px;height:16px;border-radius:8px"></span></span><span class="ds-note">md</span></div>
    <div class="ds-item" style="align-items:center"><span class="sw" style="width:48px;height:24px;border-radius:12px;justify-content:flex-end"><span class="th" style="width:27.5px;height:20px;border-radius:12px"></span></span><span class="ds-note">lg</span></div>
  </div>
  <div class="ds-item"><div style="display:flex;flex-direction:column;gap:4px"><div style="display:flex;align-items:center;gap:12px"><span class="sw off" style="width:40px;height:20px;border-radius:12px"><span class="th" style="width:22px;height:16px;border-radius:8px"></span></span><span class="lbl">Erinnerung per E-Mail</span></div><span class="d">Einen Tag vor der Abholung</span></div><span class="ds-note">off · 1px control-border outline on the track (ours, 3:1)</span></div>
  <div class="ds-item"><div style="display:flex;align-items:center;gap:12px"><span class="sw" style="width:40px;height:20px;border-radius:12px;justify-content:flex-end;box-shadow:0 0 0 2px var(--color-background),0 0 0 4px var(--color-focus)"><span class="th" style="width:22px;height:16px;border-radius:8px"></span></span><span class="lbl">Erinnerung per SMS</span></div><span class="ds-note">on · focus-visible</span></div>
  <div class="ds-item"><div style="display:flex;align-items:center;gap:12px;opacity:var(--opacity-disabled)"><span class="sw off" style="width:40px;height:20px;border-radius:12px"><span class="th" style="width:22px;height:16px;border-radius:8px"></span></span><span class="lbl">Push-Mitteilungen</span></div><span class="ds-note">disabled</span></div>
</div>
