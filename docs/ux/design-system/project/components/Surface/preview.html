<!-- @dsCard group="Layout" height=260 subtitle="Surface variants and Separator" -->
<div class="ds-stage">
  <div class="ds-row">
    <div class="ds-item"><div style="width:160px;height:88px;border-radius:var(--radius-3xl);background:var(--color-surface);box-shadow:var(--shadow-surface)"></div><span class="ds-note">default · surface</span></div>
    <div class="ds-item"><div style="width:160px;height:88px;border-radius:var(--radius-3xl);background:var(--color-surface-secondary)"></div><span class="ds-note">secondary</span></div>
    <div class="ds-item"><div style="width:160px;height:88px;border-radius:var(--radius-3xl);background:var(--color-surface-tertiary)"></div><span class="ds-note">tertiary</span></div>
    <div class="ds-item"><div style="width:160px;height:88px;display:flex;align-items:center;padding:16px;font-size:var(--text-sm);color:var(--color-foreground)">Inhalt ohne Fläche</div><span class="ds-note">transparent · no fill, no shadow</span></div>
  </div>
  <div class="ds-row" style="align-items:center">
    <div class="ds-item" style="align-items:stretch;width:343px"><div style="height:1px;border-radius:var(--radius-sm);background:var(--color-separator)"></div><span class="ds-note">Separator horizontal · 1px</span></div>
    <div class="ds-item" style="align-items:center"><div style="width:1px;height:24px;border-radius:var(--radius-sm);background:var(--color-separator)"></div><span class="ds-note">vertical · min 8</span></div>
  </div>
</div>
