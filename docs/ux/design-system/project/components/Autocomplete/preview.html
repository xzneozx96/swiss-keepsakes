<!-- @dsCard group="Selection and navigation" height=360 -->
<div class="ds-stage">
  <div class="ds-item" style="width:320px">
    <div style="display:flex;flex-direction:column;gap:var(--spacing-1);width:100%"><span style="font-size:var(--text-sm);line-height:var(--leading-sm);font-weight:var(--font-weight-medium);color:var(--color-foreground)">Produkt</span>
      <div style="display:flex;align-items:center;justify-content:space-between;height:40px;padding:0 8px 0 12px;border-radius:var(--radius-xl);background:var(--color-field);border:var(--border-width-field) solid var(--color-field-border);box-shadow:var(--shadow-surface)"><span style="font-size:var(--text-base);color:var(--color-field-placeholder)">Produkt auswählen</span><svg width="16" height="16" viewBox="0 0 16 16" fill="none" style="transform:rotate(180deg)"><path d="M4 6l4 4 4-4" stroke="var(--color-field-placeholder)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    </div>
    <div style="display:flex;flex-direction:column;width:100%;padding-top:8px;border-radius:var(--radius-3xl);background:var(--color-overlay);box-shadow:var(--shadow-overlay)">
      <div style="padding:4px 12px"><div style="display:flex;align-items:center;gap:var(--spacing-2);height:40px;padding:0 12px;border-radius:var(--radius-xl);background:var(--color-field);border:var(--border-width-field) solid var(--color-field-border-focus);box-shadow:0 0 0 1px var(--color-field-border-focus)"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="7" cy="7" r="4.5" stroke="var(--color-field-placeholder)" stroke-width="1.5"/><path d="M10.5 10.5L13 13" stroke="var(--color-field-placeholder)" stroke-width="1.5" stroke-linecap="round"/></svg><span style="font-size:var(--text-base);color:var(--color-foreground)">messer</span></div></div>
      <div style="display:flex;flex-direction:column;gap:var(--spacing-1);padding:6px">
        <div style="display:flex;align-items:center;min-height:36px;padding:6px 10px;border-radius:var(--radius-2xl);background:var(--color-default);box-shadow:0 0 0 2px var(--color-overlay),0 0 0 4px var(--color-focus)"><span style="font-size:var(--text-sm);line-height:var(--leading-sm);font-weight:var(--font-weight-medium);color:var(--color-foreground)">Kapellbrücke Taschenmesser</span></div>
        <div style="display:flex;align-items:center;min-height:36px;padding:6px 10px;border-radius:var(--radius-2xl)"><span style="font-size:var(--text-sm);line-height:var(--leading-sm);font-weight:var(--font-weight-medium);color:var(--color-foreground)">Taschenmesser Klassik</span></div>
      </div>
    </div>
    <span class="ds-note">open · search field focused · first result has keyboard focus</span>
  </div>
</div>
