<!-- @dsCard group="Selection and navigation" height=363 -->
<div class="ds-stage">
  <div class="ds-item" style="width:300px">
    <div style="display:flex;flex-direction:column;gap:var(--spacing-1);width:100%;padding:4px;border-radius:var(--radius-3xl);background:var(--color-surface);box-shadow:var(--shadow-surface)">
      <span style="padding:6px 8px 4px;font-size:var(--text-xs);line-height:var(--leading-xs);font-weight:var(--font-weight-medium);color:var(--color-muted)">Sprache</span>
      <div style="display:flex;align-items:center;justify-content:space-between;min-height:36px;padding:6px 8px;border-radius:var(--radius-2xl)"><span style="font-size:var(--text-sm);line-height:var(--leading-sm);font-weight:var(--font-weight-medium);color:var(--color-foreground)">English</span><svg width="12" height="12" viewBox="0 0 17 18" fill="none"><polyline points="1 9 7 14 15 4" stroke="var(--color-foreground)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <div style="display:flex;align-items:center;min-height:36px;padding:6px 8px;border-radius:var(--radius-2xl);background:var(--color-default)"><span style="font-size:var(--text-sm);line-height:var(--leading-sm);font-weight:var(--font-weight-medium);color:var(--color-foreground)">Deutsch</span></div>
      <div style="display:flex;align-items:center;min-height:36px;padding:6px 8px;border-radius:var(--radius-2xl);box-shadow:0 0 0 2px var(--color-surface),0 0 0 4px var(--color-focus)"><span style="font-size:var(--text-sm);line-height:var(--leading-sm);font-weight:var(--font-weight-medium);color:var(--color-foreground)">Français</span></div>
      <div style="height:1px;margin:2px 3%;background:var(--color-separator)"></div>
      <div style="display:flex;align-items:center;min-height:36px;padding:6px 8px;border-radius:var(--radius-2xl)"><span style="font-size:var(--text-sm);line-height:var(--leading-sm);font-weight:var(--font-weight-medium);color:var(--color-foreground)">Abmelden</span></div>
      <div style="display:flex;align-items:center;min-height:36px;padding:6px 8px;border-radius:var(--radius-2xl)"><span style="font-size:var(--text-sm);line-height:var(--leading-sm);font-weight:var(--font-weight-medium);color:var(--color-danger)">Konto löschen</span></div>
    </div>
    <span class="ds-note">header · selected (check) · hover · keyboard focus · separator · default · danger (destructive only)</span>
  </div>
</div>
