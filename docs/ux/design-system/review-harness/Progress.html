<!doctype html><html data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Progress</title><link rel="stylesheet" href="tokens.css"></head><body><!-- @dsCard group="Feedback" height=340 subtitle="ProgressBar, Meter, ProgressCircle, Spinner, Skeleton" -->
<div class="ds-stage">
  <div class="ds-item" style="align-items:stretch;max-width:480px">
    <div style="display:flex;flex-direction:column;gap:4px"><div style="display:flex;justify-content:space-between"><span style="font-size:var(--text-sm);font-weight:500;color:var(--color-foreground)">Tour-Plätze belegt</span><span class="num" style="font-size:var(--text-sm);font-weight:500;color:var(--color-foreground)">8 / 12</span></div><div style="height:8px;border-radius:var(--radius-sm);background:var(--color-default)"><div style="width:66%;height:8px;border-radius:var(--radius-sm);background:var(--color-foreground)"></div></div></div>
    <span class="ds-note">Meter · md 8px · fill ink</span>
  </div>
  <div class="ds-item" style="align-items:stretch;max-width:480px">
    <div style="display:flex;flex-direction:column;gap:4px"><div style="display:flex;justify-content:space-between"><span style="font-size:var(--text-sm);font-weight:500;color:var(--color-foreground)">Kostendaten vollständig</span><span class="num" style="font-size:var(--text-sm);font-weight:500;color:var(--color-foreground)">72 %</span></div><div style="height:8px;border-radius:var(--radius-sm);background:var(--color-default)"><div style="width:72%;height:8px;border-radius:var(--radius-sm);background:var(--color-foreground)"></div></div></div>
    <span class="ds-note">ProgressBar · md 8px · value shown as text</span>
  </div>
  <div class="ds-row" style="align-items:center">
    <div class="ds-item" style="align-items:center"><svg width="28" height="28" viewBox="0 0 28 28" fill="none"><circle cx="14" cy="14" r="11" stroke="var(--color-default)" stroke-width="3"/><path d="M14 3a11 11 0 0110.5 14.3" stroke="var(--color-foreground)" stroke-width="3" stroke-linecap="round"/></svg><span class="ds-note">Circle md 28</span></div>
    <div class="ds-item" style="align-items:center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="var(--color-default)" stroke-width="2.5"/><path d="M21 12a9 9 0 00-9-9" stroke="var(--color-foreground)" stroke-width="2.5" stroke-linecap="round"/></svg><span class="ds-note">Spinner md 24</span></div>
    <div class="ds-item" style="align-items:stretch;flex:1;min-width:200px"><div style="display:flex;gap:var(--spacing-3);align-items:center" aria-busy="true"><div style="width:40px;height:40px;border-radius:var(--radius-full);background:var(--color-surface-tertiary);opacity:0.7"></div><div style="display:flex;flex-direction:column;gap:6px;flex:1"><div style="height:12px;width:70%;border-radius:var(--radius-sm);background:var(--color-surface-tertiary);opacity:0.7"></div><div style="height:12px;width:45%;border-radius:var(--radius-sm);background:var(--color-surface-tertiary);opacity:0.7"></div></div></div><span class="ds-note">Skeleton · radius 4 · surface-tertiary at 70% · shimmer 2s</span></div>
  </div>
</div>
</body></html>
