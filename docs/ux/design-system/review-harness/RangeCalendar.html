<!doctype html><html data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RangeCalendar</title><link rel="stylesheet" href="tokens.css"></head><body><!-- @dsCard group="Date and data" height=230 -->
<div class="ds-stage">
  <style>
    .sk-rc{display:flex;flex-direction:column;width:252px}
    .sk-rc .row{display:flex;padding:2px 0}
    .sk-rc .wd{width:36px;text-align:center;font-size:var(--text-xs);line-height:var(--leading-xs);font-weight:var(--font-weight-medium);color:var(--color-muted)}
    .sk-rc .d{width:36px;height:36px;display:flex;align-items:center;justify-content:center;font-size:var(--text-sm);font-weight:var(--font-weight-medium);color:var(--color-foreground);border-radius:var(--radius-3xl);flex-shrink:0}
    .sk-rc .cap{background:var(--color-accent);color:var(--color-accent-foreground)}
    .sk-rc .band{display:flex;height:36px;background:var(--color-accent-soft)}
  </style>
  <div class="ds-item">
    <div class="sk-rc">
      <div class="row" style="padding-bottom:8px"><span class="wd">Mo</span><span class="wd">Di</span><span class="wd">Mi</span><span class="wd">Do</span><span class="wd">Fr</span><span class="wd">Sa</span><span class="wd">So</span></div>
      <div class="row"><div class="d">12</div><div class="d">13</div><div class="d">14</div><div class="band" style="width:144px;border-radius:24px 8px 8px 24px"><div class="d cap">15</div><div class="d">16</div><div class="d">17</div><div class="d">18</div></div></div>
      <div class="row"><div class="band" style="width:144px;border-radius:8px 24px 24px 8px"><div class="d">19</div><div class="d">20</div><div class="d">21</div><div class="d cap">22</div></div><div class="d">23</div><div class="d">24</div><div class="d">25</div></div>
    </div>
    <span class="ds-note">range 15.10.–22.10.2026 · caps solid accent · band wraps to the next week (8px ends)</span>
  </div>
</div>
</body></html>
