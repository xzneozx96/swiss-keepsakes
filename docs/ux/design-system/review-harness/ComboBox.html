<!doctype html><html data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ComboBox</title><link rel="stylesheet" href="tokens.css"></head><body><!-- @dsCard group="Selection and navigation" height=300 -->
<div class="ds-stage">
  <div class="ds-item" style="width:300px">
    <div style="display:flex;flex-direction:column;gap:var(--spacing-1);width:100%"><span style="font-size:var(--text-sm);line-height:var(--leading-sm);font-weight:var(--font-weight-medium);color:var(--color-foreground)">Land</span>
      <div style="display:flex;align-items:center;justify-content:space-between;height:40px;padding:0 8px 0 12px;border-radius:var(--radius-xl);background:var(--color-field);border:var(--border-width-field) solid var(--color-field-border-focus);box-shadow:0 0 0 1px var(--color-field-border-focus)"><div style="display:flex;align-items:center"><span style="font-size:var(--text-base);color:var(--color-foreground)">Sch</span><div style="width:1px;height:20px;background:var(--color-foreground)"></div></div><svg width="16" height="16" viewBox="0 0 16 16" fill="none" style="transform:rotate(180deg)"><path d="M4 6l4 4 4-4" stroke="var(--color-field-placeholder)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    </div>
    <div style="display:flex;flex-direction:column;gap:var(--spacing-1);width:100%;padding:6px;border-radius:var(--radius-3xl);background:var(--color-overlay);box-shadow:var(--shadow-overlay)">
      <div style="display:flex;align-items:center;min-height:36px;padding:6px 10px;border-radius:var(--radius-2xl);background:var(--color-default);box-shadow:0 0 0 2px var(--color-overlay),0 0 0 4px var(--color-focus)"><span style="font-size:var(--text-sm);line-height:var(--leading-sm);font-weight:var(--font-weight-medium);color:var(--color-foreground)">Schweiz</span></div>
      <div style="display:flex;align-items:center;min-height:36px;padding:6px 10px;border-radius:var(--radius-2xl)"><span style="font-size:var(--text-sm);line-height:var(--leading-sm);font-weight:var(--font-weight-medium);color:var(--color-foreground)">Schweden</span></div>
    </div>
    <span class="ds-note">input focused · 2px flush ring · first match has keyboard focus</span>
  </div>
</div>
</body></html>
