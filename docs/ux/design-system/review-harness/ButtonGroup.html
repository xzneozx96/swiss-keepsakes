<!doctype html><html data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ButtonGroup</title><link rel="stylesheet" href="tokens.css"></head><body><!-- @dsCard group="Actions" height=220 -->
<div class="ds-stage">
  <style>
    .g{display:inline-flex;width:fit-content}
    .gb{position:relative;display:inline-flex;align-items:center;justify-content:center;height:40px;padding:0 16px;font-family:var(--font-sans);font-size:var(--text-sm);font-weight:var(--font-weight-medium);color:var(--color-foreground);white-space:nowrap}
    .gb-out{box-shadow:inset 0 0 0 1px var(--color-border)}
    .gb-sep{position:absolute;left:0;top:25%;width:1px;height:50%;border-radius:var(--radius-sm);background:currentColor;opacity:0.15}
  </style>
  <div class="ds-item">
    <div class="g">
      <span class="gb gb-out" style="border-radius:24px 0 0 24px">Exportieren</span>
      <span class="gb gb-out" style="width:40px;padding:0;border-radius:0 24px 24px 0;margin-left:-1px" aria-label="Weitere Formate"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
    </div>
    <span class="ds-note">outline split button · one 1px line between parts</span>
  </div>
  <div class="ds-item">
    <div class="g">
      <span class="gb" style="background:var(--color-default);border-radius:24px 0 0 24px">Drucken</span>
      <span class="gb" style="background:var(--color-default)"><span class="gb-sep"></span>Teilen</span>
      <span class="gb" style="background:var(--color-default);border-radius:0 24px 24px 0"><span class="gb-sep"></span>Duplizieren</span>
    </div>
    <span class="ds-note">tertiary group of related actions · divider currentColor 15%, half height</span>
  </div>
</div>
</body></html>
