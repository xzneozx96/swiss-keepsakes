<!doctype html><html data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cover</title><link rel="stylesheet" href="tokens.css"></head><body><!-- @dsCard height=300 -->
<div style="position:relative;width:960px;height:300px;background:var(--color-background);overflow:hidden">
  <style>
    .cv-photo{position:absolute;left:480px;top:0;width:480px;height:300px;object-fit:cover;object-position:52% 42%;display:block}
    .cv-name{position:absolute;left:48px;bottom:40px;width:400px;display:flex;flex-direction:column;gap:12px}
    .cv-title{font-family:var(--font-serif);font-weight:500;font-size:80px;line-height:0.95;letter-spacing:-0.02em;color:var(--color-foreground);margin:0}
    .cv-tag{font-family:var(--font-sans);font-size:14px;line-height:20px;color:var(--color-muted);margin:0}
  </style>
  <!--
    owner request: a real Lucerne photo instead of block-and-pattern geometry
    photo: Kapellbrücke, Wasserturm and Pilatus, CC0 by Juliet van Ree (Wikimedia Commons), assets/Photos/lucerne-kapellbruecke.jpg
    layout: name zone x 48–448 on color-background, photo zone x 480–960, no decorative red (red stays for actions)
    type: display face (Source Serif 4) at 80px, two lines, tagline Inter 14px in color-muted
  -->
  <img class="cv-photo" src="../project/assets/Photos/lucerne-kapellbruecke.jpg" alt="Kapellbrücke and the Water Tower in Lucerne, with Mount Pilatus behind">
  <div class="cv-name">
    <p class="cv-title">Swiss Keepsakes</p>
    <p class="cv-tag">Keepsakes and tours from Lucerne, prepared by local makers.</p>
  </div>
</div>
</body></html>
