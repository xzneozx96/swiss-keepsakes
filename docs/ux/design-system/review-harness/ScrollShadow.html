<!doctype html><html data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ScrollShadow</title><link rel="stylesheet" href="tokens.css"></head><body><!-- @dsCard group="Layout" height=170 subtitle="Horizontal rail of TagGroup lg tags with a 40px fade" -->
<div class="ds-stage">
  <div class="ds-item">
    <div role="listbox" aria-label="Kategorien" style="position:relative;display:flex;gap:6px;overflow:hidden;padding:4px 0;width:343px">
      <div style="flex-shrink:0;display:flex;align-items:center;gap:4px;height:32px;padding:0 10px;border-radius:var(--radius-2xl);background:var(--color-accent-soft);box-shadow:inset 0 0 0 1px var(--color-selected-border);font-size:var(--text-sm);font-weight:500;color:var(--color-accent-soft-foreground)"><svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M2.5 6.2l2.3 2.3 4.7-5" stroke="var(--color-accent-soft-foreground)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>Alle</div>
      <div style="flex-shrink:0;display:flex;align-items:center;height:32px;padding:0 10px;border-radius:var(--radius-2xl);background:var(--color-default);font-size:var(--text-sm);font-weight:500;color:var(--color-foreground)">Geschenke</div>
      <div style="flex-shrink:0;display:flex;align-items:center;height:32px;padding:0 10px;border-radius:var(--radius-2xl);background:var(--color-default);font-size:var(--text-sm);font-weight:500;color:var(--color-foreground)">Touren</div>
      <div style="flex-shrink:0;display:flex;align-items:center;height:32px;padding:0 10px;border-radius:var(--radius-2xl);background:var(--color-default);font-size:var(--text-sm);font-weight:500;color:var(--color-foreground)">Geschichten</div>
      <div style="flex-shrink:0;display:flex;align-items:center;height:32px;padding:0 10px;border-radius:var(--radius-2xl);background:var(--color-default);font-size:var(--text-sm);font-weight:500;color:var(--color-foreground)">Tipps</div>
      <div style="position:absolute;right:0;top:0;width:40px;height:40px;background:linear-gradient(90deg,transparent,var(--color-background))"></div>
    </div>
    <span class="ds-note">343px rail · TagGroup lg 32px, gap 6 · selected = soft red + check + outline · 40px fade</span>
  </div>
</div>
</body></html>
