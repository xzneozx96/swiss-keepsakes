<!doctype html><html data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Toolbar</title><link rel="stylesheet" href="tokens.css"></head><body><!-- @dsCard group="Actions" height=150 -->
<div class="ds-stage">
  <style>
    .tb{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:var(--radius-3xl);color:var(--color-foreground)}
    .tb-on{background:var(--color-accent-soft);color:var(--color-accent-soft-foreground);box-shadow:inset 0 0 0 1px var(--color-selected-border)}
  </style>
  <div class="ds-item">
    <div style="display:inline-flex;align-items:center;gap:8px;padding:4px;border-radius:var(--radius-3xl);background:var(--color-surface);box-shadow:var(--shadow-overlay)">
      <span class="tb tb-on" aria-label="Fett" style="font-family:var(--font-sans);font-weight:var(--font-weight-semibold);font-size:var(--text-sm)">B</span>
      <span class="tb" aria-label="Kursiv" style="font-family:var(--font-serif);font-style:italic;font-size:var(--text-base)">I</span>
      <span class="tb" aria-label="Link"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M6.5 9.5l3-3M7 4.5l1-1a2.5 2.5 0 013.5 3.5l-1 1M9 11.5l-1 1A2.5 2.5 0 014.5 9l1-1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></span>
      <span style="width:1px;height:18px;background:var(--color-separator)"></span>
      <span class="tb" aria-label="Bild"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><rect x="2.5" y="3.5" width="11" height="9" rx="1.5" stroke="currentColor" stroke-width="1.5"/><path d="M4.5 11l2.5-3 2 2 1.5-1.5 1.5 2.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
    </div>
    <span class="ds-note">attached toolbar · story editor (M17) · selected toggle = accent-soft + 1px selected-border · arrow keys move focus</span>
  </div>
</div>
</body></html>
