# The gates, the pull request's Neon branch with migrations, integration tests and the Playwright specs, and the
# API image. docs/ops/ci.md explains each job and the Neon safety rules.
# Actions are pinned by commit. The comment after each pin is the release it points to.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    # closed deletes the pull request's Neon branch.
    types: [opened, synchronize, reopened, closed]

# One run per pull request. A push cancels the run it replaces, and a close cancels a run that may still be
# creating the branch, then deletes it. Runs on main are never cancelled.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  gates:
    if: github.event.action != 'closed'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # Each gate runs even when an earlier one failed, so the run shows every result.
      - name: Trace script tests
        run: node --test scripts/trace.test.mjs
      - name: Story traceability
        if: ${{ !cancelled() }}
        run: node scripts/trace.mjs docs/development-plan/delivery-plan.md
      - name: Install
        id: install
        if: ${{ !cancelled() }}
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm typecheck
      - name: Unit tests and the contract gate
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm test
      - name: Layer zones
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm lint:zones
      - name: API lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm --filter @sk/api lint
      - name: Front-end lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm --dir front-end lint
      - name: Front-end test typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm --dir front-end typecheck:tests
      - name: Build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm build
      # Production dependencies ship in the image, so a high or critical advisory blocks the merge.
      - name: Audit production dependencies
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm audit --prod --audit-level=high
      # Advisories in development dependencies only warn. A registry outage fails the step: pnpm audit exits 1 for
      # both, so the JSON tells them apart.
      - name: Audit development dependencies (warning only)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          pnpm audit --json > audit.json || true
          if ! jq -e '.metadata.vulnerabilities' audit.json > /dev/null; then
            cat audit.json
            echo '::error::pnpm audit returned no report'
            exit 1
          fi
          jq -r '.advisories[] | "\(.severity) \(.module_name) \(.github_advisory_id) via \(.findings[0].paths[0])"' audit.json
          count=$(jq '.metadata.vulnerabilities.high + .metadata.vulnerabilities.critical' audit.json)
          if [ "$count" != 0 ]; then
            echo "::warning title=Dependency audit::$count high or critical advisories in development dependencies. This step lists them."
          fi

  # The integration job takes 15 to 27 minutes on a remote Neon branch. It runs only when the pull request changes
  # something it can break. Any doubt runs it: a failed diff or a base the runner cannot reach sets api=true.
  changes:
    name: changes
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      api: ${{ steps.diff.outputs.api }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Does the pull request touch what the integration tests cover
        id: diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          pattern='^(api/|packages/|scripts/|\.github/|front-end/tests/e2e/|front-end/playwright\.config|front-end/vite\.config|front-end/src/main\.tsx|front-end/src/lib/|front-end/src/features/(auth|stores)/|e2e/|package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml|\.nvmrc|Dockerfile|vitest\.)'
          if files=$(git diff --name-only "$BASE_SHA"...HEAD) && ! printf '%s\n' "$files" | grep -Eq "$pattern"; then
            echo 'api=false' >> "$GITHUB_OUTPUT"
            echo '::notice title=Integration skipped::No changed file is under a path the integration tests cover.'
          else
            echo 'api=true' >> "$GITHUB_OUTPUT"
          fi

  integration:
    name: integration (Neon)
    needs: changes
    if: github.event_name == 'pull_request' && github.event.action != 'closed' && needs.changes.outputs.api == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Neon secret
        id: neon
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [ -n "$NEON_API_KEY" ]; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
          elif [ "$HEAD_REPO" != "$GITHUB_REPOSITORY" ] || [ "$GITHUB_ACTOR" = 'dependabot[bot]' ]; then
            echo '::notice title=No Neon branch::GitHub gives no secrets to pull requests from forks or Dependabot, so this job creates no Neon branch and runs no integration tests. The other jobs still run.'
            echo 'available=false' >> "$GITHUB_OUTPUT"
          else
            echo '::error::The NEON_API_KEY secret is missing.'
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.neon.outputs.available == 'true'
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: steps.neon.outputs.available == 'true'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.neon.outputs.available == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # preview/pr-<number> from development, expiring in 3 days, or the same branch again with a new expiry.
      # Not neondatabase/create-branch-action: its password and URL outputs are unmasked, and debug logs print outputs.
      - name: Create or reuse the Neon branch
        if: steps.neon.outputs.available == 'true'
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
        run: node scripts/neon-preview-branch.mjs create
      # Resets the branch's password first, so the URLs every later step sees work on this branch only.
      - name: Connect to the Neon branch
        id: connect
        if: steps.neon.outputs.available == 'true'
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
        run: node scripts/neon-preview-branch.mjs connect
      - name: Install
        if: steps.neon.outputs.available == 'true'
        run: pnpm install --frozen-lockfile
      - name: The branch holds no migration this commit lacks
        if: steps.neon.outputs.available == 'true'
        run: pnpm --filter @sk/api db:check-branch
      # The release command from source (tsx) over the direct URL. The API image job runs the compiled one.
      # There are no seeds yet: the first module story adds them.
      - name: Migrate the branch
        if: steps.neon.outputs.available == 'true'
        run: pnpm --filter @sk/api db:migrate
        env:
          # The release command reads the whole config schema. It never signs anyone in, so these are fake values.
          # The secret only has to pass the 32 character check.
          BETTER_AUTH_URL: https://app.example.test
          APP_URL: https://app.example.test
          BETTER_AUTH_SECRET: ci-migrate-placeholder-not-a-secret-0000
      - name: Drop test databases left by a cancelled run
        if: steps.neon.outputs.available == 'true'
        run: |
          for db in $(psql "$DATABASE_URL_UNPOOLED" -Atc "select datname from pg_database where datname like 'sk\_test\_%'"); do
            psql "$DATABASE_URL_UNPOOLED" -qc "drop database \"$db\" with (force)"
            echo "dropped $db"
          done
      # Each run creates its own sk_test_* database on the branch and drops it. Request pools go through Neon's
      # pooler (DATABASE_URL), pg-boss and migrations through the direct URL.
      - name: Integration tests
        if: steps.neon.outputs.available == 'true'
        env:
          INTEGRATION_ALLOW_REMOTE_DATABASE: '1'
        run: pnpm test:integration
      # Every Playwright spec runs the real API against its own sk_test_* database on the same branch (docs/ops/ci.md).
      # The harness starts the API and drops the database when Playwright stops it.
      - name: Install Playwright browsers
        if: ${{ !cancelled() && steps.neon.outputs.available == 'true' }}
        run: pnpm exec playwright install --with-deps chromium webkit
        working-directory: front-end
      - name: Sign-in and stores end to end
        if: ${{ !cancelled() && steps.neon.outputs.available == 'true' }}
        env:
          INTEGRATION_ALLOW_REMOTE_DATABASE: '1'
          CI: 'true'
        run: pnpm test:e2e
        working-directory: front-end
      - name: Demo flows end to end
        if: ${{ !cancelled() && steps.neon.outputs.available == 'true' }}
        env:
          INTEGRATION_ALLOW_REMOTE_DATABASE: '1'
          CI: 'true'
        run: pnpm e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure() && steps.neon.outputs.available == 'true'
        with:
          name: playwright-report
          path: |
            front-end/playwright-report
            front-end/test-results
            e2e/playwright-report
            e2e/test-results
          retention-days: 14
      - name: The run dropped its test database
        if: always() && steps.connect.outcome == 'success'
        run: |
          left=$(psql "$DATABASE_URL_UNPOOLED" -Atc "select count(*) from pg_database where datname like 'sk\_test\_%'")
          echo "sk_test_* databases left on the branch: $left"
          test "$left" = 0

  neon-cleanup:
    name: delete Neon branch
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Neon secret
        id: neon
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [ -n "$NEON_API_KEY" ]; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
          elif [ "$HEAD_REPO" != "$GITHUB_REPOSITORY" ] || [ "$GITHUB_ACTOR" = 'dependabot[bot]' ]; then
            echo '::notice title=No Neon branch::GitHub gives no secrets to pull requests from forks or Dependabot, so this pull request never had a Neon branch.'
            echo 'available=false' >> "$GITHUB_OUTPUT"
          else
            echo '::error::The NEON_API_KEY secret is missing.'
            exit 1
          fi
      # The delete runs reviewed code from the default branch, never the pull request's own, and works for a
      # pull request whose head predates the script.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.neon.outputs.available == 'true'
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: scripts
      - name: Choose the delete script
        id: script
        if: steps.neon.outputs.available == 'true'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ -f scripts/neon-preview-branch.mjs ]; then
            echo 'path=scripts/neon-preview-branch.mjs' >> "$GITHUB_OUTPUT"
          else
            echo "::notice::$DEFAULT_BRANCH has no scripts/neon-preview-branch.mjs yet, so this run uses the copy at the pull request head."
            echo 'path=pr-head/scripts/neon-preview-branch.mjs' >> "$GITHUB_OUTPUT"
          fi
      # Only until the default branch has the script, which is while the E1.13 stack is unmerged.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.neon.outputs.available == 'true' && steps.script.outputs.path != 'scripts/neon-preview-branch.mjs'
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr-head
          persist-credentials: false
          sparse-checkout: scripts
      - name: Delete preview/pr-${{ github.event.pull_request.number }}
        if: steps.neon.outputs.available == 'true'
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          SCRIPT: ${{ steps.script.outputs.path }}
        run: |
          [[ "preview/pr-$PR_NUMBER" =~ ^preview/pr-[1-9][0-9]*$ ]] || { echo "::error::Refusing to delete preview/pr-$PR_NUMBER"; exit 1; }
          [ -f "$SCRIPT" ] || { echo "::error::Neither the default branch nor the pull request head has scripts/neon-preview-branch.mjs. preview/pr-$PR_NUMBER expires on its own within 3 days."; exit 1; }
          node "$SCRIPT" delete

  image:
    name: API image
    if: github.event.action != 'closed'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: swiss_keepsakes
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres -d swiss_keepsakes"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Built and tested, not pushed: no registry is chosen yet.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: sk-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: scripts/image-smoke.sh sk-api:ci postgres://postgres@127.0.0.1:5432/swiss_keepsakes
