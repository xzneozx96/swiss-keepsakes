# Local services for the API (architecture section 11). `docker compose up -d --wait` starts them.
# Ports bind to 127.0.0.1 only, and nothing here is a secret: Postgres trusts local connections,
# and MinIO runs on its built-in default credentials because no root user is set.
name: swiss-keepsakes

services:
  postgres:
    # Neon runs Postgres 18.6 (docs/spikes/SP2.md).
    image: postgres:18.6
    environment:
      POSTGRES_DB: swiss_keepsakes
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - 127.0.0.1:5433:5432
    volumes:
      # From Postgres 18 the image keeps its data under /var/lib/postgresql/18/docker.
      - postgres:/var/lib/postgresql
    healthcheck:
      test: [CMD, pg_isready, -U, postgres, -d, swiss_keepsakes]
      interval: 2s
      timeout: 5s
      retries: 30

  minio:
    # MinIO stopped publishing community images in October 2025. This is the owner's GHCR copy of the last one.
    image: ghcr.io/xzneozx96/minio:RELEASE.2025-09-07T16-13-09Z
    command: [server, /data]
    ports:
      - 127.0.0.1:9100:9000
    volumes:
      - minio:/data
    healthcheck:
      test: [CMD, curl, -f, http://localhost:9000/minio/health/live]
      interval: 2s
      timeout: 5s
      retries: 30

  mailpit:
    image: axllent/mailpit:v1.31.6
    ports:
      - 127.0.0.1:1025:1025
      - 127.0.0.1:8025:8025
    healthcheck:
      test: [CMD, /mailpit, readyz]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  postgres:
  minio:
