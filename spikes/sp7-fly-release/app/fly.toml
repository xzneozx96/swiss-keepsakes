primary_region = "fra"

[build]

[deploy]
  release_command = "npx tsx migrate.ts"
  strategy = "bluegreen"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "5s"
    timeout = "2s"
    method = "GET"
    path = "/healthz"
